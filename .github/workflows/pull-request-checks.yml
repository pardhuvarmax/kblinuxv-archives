name: KB-LVA PR Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  integrity-and-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml requests
      # Hashes match the manifest; verification states are evidenced; stored files are allow-licensed, pinned and
      # small; nothing under local-only/ is tracked. Reads files only.
      - run: python tools/validation/verify_hashes.py
      - run: python tools/validation/check_policy.py
