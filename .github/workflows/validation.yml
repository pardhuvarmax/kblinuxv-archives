name: KB-LVA Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  schema-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml requests jsonschema pytest
      # Validates metadata structure and runs unit tests. Never executes or compiles anything under corpus/.
      - run: python tools/validation/validate_schema.py
      - run: python -m pytest -q
