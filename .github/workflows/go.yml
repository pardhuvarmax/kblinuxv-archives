name: kblva (Go)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # Includes the golden test: regenerating normalized data must match what is committed.
      - run: go test ./...
      - run: go build -o /dev/null ./cmd/kblva
      # The Go validators on the real dataset: schemas, hashes, policy. Reads files only.
      - run: go run ./cmd/kblva validate
