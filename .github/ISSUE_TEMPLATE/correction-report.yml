name: Correction report
description: Report a wrong CVE association, classification, license or broken reference
body:
  - type: input
    id: artifact
    attributes:
      label: Artifact ID or CVE
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong, and what is the evidence?
    validations:
      required: true
